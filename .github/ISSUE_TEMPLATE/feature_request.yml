name: Feature request
description: Something the web client should do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation and what gets in the way today. A concrete case beats a general idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: >-
        How you imagine it working, if you have something in mind. The client only does what the
        server's API offers; a feature that needs the server belongs in the server repository.
