name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Laterna Web version
      description: The release you installed, or the commit if you built it yourself.
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Laterna server version
      description: The output of `laterna version`, or the Docker image tag.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Firefox 150, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console and logs
      description: >-
        Errors from the browser console, and the relevant lines of the server log. For a playback
        problem, add the playback information the player shows. Remove anything private.
      render: text
