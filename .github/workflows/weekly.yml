name: Weekly

# Checks that do not belong on every push: new advisories against unchanged dependencies, the
# whole check on the pinned server version, and whether a newer server release changes the client.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm audit

  check:
    name: Full check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Newer server releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pinned=$(node -p "require('./package.json').laternaServer")
          latest=$(gh release view --repo laterna-project/laterna --json tagName --jq .tagName)
          if [ "$latest" = "$pinned" ]; then exit 0; fi
          # Does the new release change what the client is generated from (contract, texts)?
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$latest" \
            https://github.com/laterna-project/laterna.git "$RUNNER_TEMP/server"
          if LATERNA_SOURCE="$RUNNER_TEMP/server" pnpm gen:check > /dev/null; then
            echo "::notice::The server released $latest, with the same contract and texts as $pinned: move the pin (laternaServer) and the README's table of server versions."
          else
            echo "::warning::The server released $latest, whose contract or texts differ from $pinned: generate the client from it and adapt (docs/releasing.md, Following the server)."
          fi
